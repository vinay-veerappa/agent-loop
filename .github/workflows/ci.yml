name: CI

# Why this exists
# ---------------
# This repo had NO workflow at all until 2026-08-16, while three consumer
# repos depend on it as an editable install. The cost was measured rather
# than guessed: two consecutive fix commits landed with no tests, and a
# read of them found six defects (CF-16..CF-21), one of which wrote a
# diagnosis into a field no reader consumes.
#
# ⚠️ Windows is the FIRST entry deliberately, not an afterthought. Every
# encoding defect this project has shipped -- and there have been several,
# in three separate repos -- is a cp1252 decode that cannot reproduce on
# Linux. A green Linux-only matrix would have said nothing about any of them.
#
# The suite is ~2 minutes. There is no reason for it not to run on every push.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ WINDOWS ONLY, and that is a finding rather than a preference.
        # The first run of this workflow was red on all three jobs and both
        # causes were pre-existing, invisible because nothing had ever run
        # this suite anywhere but one developer machine:
        #
        #   ubuntu  -- the test FIXTURES shell out with
        #              os.system('cd /d "{repo}" && git init ...'), which is
        #              cmd.exe syntax. The suite is not portable, and adding
        #              a linux job that is permanently red is worse than not
        #              having one: a CI that is always red is off. Recorded
        #              as CF-22; when the fixtures are fixed, add it back.
        #   windows -- 37 of 39 failures were ONE cause, below.
        os: [windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Give git an identity
        # ⚠️ 37 of the first run's 39 Windows failures were this. Dozens of
        # tests build a scratch repo and commit into it; a runner has no
        # global user.email, so every `git commit` failed, the repo was left
        # with no HEAD, and the error surfaced as
        #   "git rev-parse HEAD failed: ambiguous argument 'HEAD'"
        # which reads as a defect in workspace.py rather than as missing
        # config. The suite passed locally because the developer machine has
        # an identity -- local green was evidence about the machine.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Show what is actually resolved
        # The version constant has not moved since v0.6.7 while the code has.
        # Print the resolved path so a run's evidence names the code it tested.
        run: python -m agent_loop --version
      - name: Tests
        run: python -m pytest -q

      # ⚠️ A SECOND HARNESS, and nothing ran it. `agent_loop.selftest` drives the
      # whole loop against stubbed models and asserts a verdict per scenario. It
      # was found at 13/13 -> 11/13, failing on a verdict name the ticket path
      # does not produce, for an unknown number of sessions -- while `pytest -q`
      # was green and this workflow reported that green as the repo's state.
      # A harness nobody runs is not a harness.
      - name: Selftest (end-to-end scenarios against stubbed models)
        run: python -m agent_loop.selftest
